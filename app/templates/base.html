<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/img/image.ico" type="image/x-icon">
    <title>{% block title %}Canamania{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/ui.css?v=1">
    {% block styles %}{% endblock %}
    <link rel="stylesheet" href="/static/css/responsive.css?v=3">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    {% if usuario is defined and usuario %}
    {% include "partials/navbar.html" %}
    {% endif %}

    {% block content %}{% endblock %}

    {% block footer %}
    <footer class="main-footer"><p>&copy; 2026 Canamania. Gestão de consumos.</p></footer>
    {% endblock %}
    {% block scripts %}{% endblock %}
</body>
</html>

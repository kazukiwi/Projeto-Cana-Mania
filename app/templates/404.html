<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/img/image.ico" type="image/x-icon">
    <title>Página não encontrada (404) - CanaMania</title>
    <link rel="stylesheet" href="/static/css/erro.css?v=2">
    <link rel="stylesheet" href="/static/css/theme-accents.css?v=global-theme-3">
</head>

<body>
    <main class="erro-page">
        <section class="erro-card erro-card--404" aria-labelledby="titulo-erro">
            <a href="/" class="erro-marca"><span>Cana</span>mania<small>gestão de consumos</small></a>
            <p class="erro-etiqueta">Erro 404</p>
            <h1 id="titulo-erro" class="erro-titulo">Página não encontrada</h1>
            
            <div class="robo-wrap">
                <img src="/static/img/canamania.jpg" alt="CanaMania" class="robo-img">
                
                <div class="balao-fala" id="mensagem-erro" aria-live="polite">
                    <p>Não encontramos o endereço que você tentou acessar.</p>
                </div>
            </div>

            <p class="erro-subtexto">
                O link que você tentou acessar pode estar quebrado ou a página foi removida.
            </p>

            <div class="erro-acoes">
                <button type="button" class="btn-inicio" onclick="history.back()">Voltar</button>
                <a href="/" class="btn-voltar">Ir para o início</a>
            </div>
        </section>
    </main>
<script src="/static/javascript/theme.js?v=global-theme-1"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/img/image.ico" type="image/x-icon">
    <title>Página não encontrada (404) - AAPM</title>
    <link rel="stylesheet" href="/static/css/erro.css">
    <link rel="stylesheet" href="/static/css/responsive.css?v=1">
</head>

<body>
    <main class="erro-page">
        <section class="erro-card" aria-labelledby="titulo-erro">
            <h1 class="erro-codigo">404</h1>
            
            <div class="robo-wrap">
                <img src="/static/img/robot-404.png" alt="Ilustração de um robô confuso" class="robo-img">
                
                <div class="balao-fala" id="mensagem-erro" aria-live="polite">
                    <p>Tá indo aonde?? Essa tela não existe!</p>
                </div>
            </div>

            <p class="erro-subtexto">
                O link que você tentou acessar pode estar quebrado ou a página foi removida.
            </p>

            <div class="erro-acoes">
                <a href="/" class="btn-voltar">Voltar para o início</a>
            </div>
        </section>
    </main>
</body>

</html>

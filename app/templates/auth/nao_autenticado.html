<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/img/image.ico" type="image/x-icon">
    <title>Sessão não autenticada - AAPM</title>
    <link rel="stylesheet" href="/static/css/erro.css?v=2">
    <link rel="stylesheet" href="/static/css/theme-accents.css?v=global-theme-3">
</head>
<body>
    <main class="erro-page">
        <section class="erro-card erro-card--401" aria-labelledby="titulo-nao-autenticado">
            <a href="/" class="erro-marca"><span>Cana</span>mania<small>gestão de consumos</small></a>
            <p class="erro-etiqueta">Erro 401</p>
            <h1 id="titulo-nao-autenticado" class="erro-titulo">Sua sessão expirou</h1>
            <div class="robo-wrap">
                <img src="/static/img/canamania.jpg" alt="CanaMania" class="robo-img">
                <div class="balao-fala">
                    <p>Faça login novamente para continuar com segurança.</p>
                </div>
            </div>
            <p class="erro-subtexto">
                Sua sessão pode ter expirado ou você ainda não fez login.
            </p>
            <div class="erro-acoes">
                <a href="/" class="btn-voltar">Ir para o login</a>
            </div>
        </section>
    </main>
<script src="/static/javascript/theme.js?v=global-theme-1"></script>

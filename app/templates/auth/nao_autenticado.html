<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <link rel="icon" href="/static/img/image.ico" type="image/x-icon">
    <title>Sessão não autenticada - AAPM</title>

<body>

                <img src="/static/img/robot-404.png" alt="Ilustração de acesso restrito" class="robo-img">
                <div class="balao-fala">
                    <p>Você não está autenticado para acessar esta página.</p>

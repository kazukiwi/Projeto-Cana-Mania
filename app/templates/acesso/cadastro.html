<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar conta | Canamania</title><style>body{margin:0;background:#f3faf5;color:#153c2c;font:16px system-ui,sans-serif}main{max-width:440px;margin:8vh auto;padding:20px}.card{background:white;border:1px solid #d7eadf;border-radius:22px;padding:28px}label{display:block;font-weight:700;margin-top:16px}input,button{box-sizing:border-box;width:100%;padding:12px;margin-top:6px;font:inherit;border:1px solid #bdd4c4;border-radius:9px}button{margin-top:20px;background:#0b6b44;color:white;font-weight:700;cursor:pointer}.erro{color:#a41c42}a{color:#075f3b}</style></head><body><main><div class="card"><strong>CANAMANIA</strong><h1>Criar minha conta</h1><p>Cadastre-se para guardar seus comprovantes.</p>{% if erro %}<p class="erro" role="alert">{{ erro }}</p>{% endif %}<form action="/acesso/cadastro" method="post"><label>Nome<input name="nome" maxlength="100" autocomplete="name" value="{{ nome or '' }}" required></label><label>E-mail<input name="email" type="email" maxlength="100" autocomplete="email" value="{{ email or '' }}" required></label><label>Senha<input name="senha" type="password" minlength="8" maxlength="72" autocomplete="new-password" required></label><button type="submit">Criar conta</button></form><p><a href="/acesso/">Voltar</a></p></div></main></body></html>
